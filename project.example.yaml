# ═══════════════════════════════════════════════════════════════
#  複製成 project.yaml，改成你自己的路徑就可以跑
#  只有 project.source_video 是一定要填的
#  改完先跑 python run.py --check 驗證
# ═══════════════════════════════════════════════════════════════

project:
  name: "帆船船長訪談"
  event: "Sailing Interviews"           # FCP 匯入後的事件名稱
  source_video: "~/Movies/interview.mov"
  build_dir: "build"
  language: "en"                        # 訪談語音的語言
  target_language: "zh-Hant"
  source_timecode: ""                   # ffprobe 讀不到嵌入時間碼時手動指定
                                        # 例如 "21:43:27;18"（分號 = drop frame）

sequence:
  width: 0        # 0 = 沿用原始影片
  height: 0
  fps: ""         # "" = 沿用原始影片；也可寫 "30000/1001" 或 "25"
  audio_rate: 48000

speakers:
  # 跑完 stage 02 後看 build/02_transcript.txt，把代號對到真名再往下跑
  map: {}
  # map:
  #   SPEAKER_00: "Captain Lee"
  #   SPEAKER_01: "主持人"
  host_hint: "問問題的是主持人，回答的是帆船船長"

transcribe:
  model: "large-v3"    # 想快一點可用 medium / small
  device: "auto"
  compute_type: "auto"
  diarize: true        # 說話者分離；沒有 HF_TOKEN 會自動跳過
  num_speakers: 2
  hf_token_env: "HF_TOKEN"

# ── 功能一：剪掉過久停頓與結巴 ──────────────────────────────
cleanup:
  enabled: true
  remove_fillers: true       # um / uh / you know 這類發語詞
  remove_repetitions: true   # 連續講兩次同一個字
  remove_false_starts: true  # 講到一半改口重講
  remove_tangents: false     # 離題整段刪掉，較激進，預設關閉
  max_pause: 0.60            # 超過這個秒數的靜默算「太久」
  keep_pause: 0.22           # 砍完保留多少，維持自然呼吸感
  cut_pad: 0.06              # 每刀左右縮回多少，避免切到字頭字尾
  min_removal: 0.10          # 小於此長度的刪除直接略過
  min_keep: 0.30             # 小於此長度的保留片段併入鄰居

# ── 功能二：中英雙語字幕檔 ──────────────────────────────────
subtitles:
  fcp_captions: "zh"       # FCP 裡放幾條字幕軌：zh / en / both / none
                           # both 會讓中英同時疊在畫面上；YouTube CC 一律用 .srt
  glossary_file: ""        # 留空 = build/04_glossary.txt
                           # 這個檔案可以編輯，你寫的譯法優先，AI 只補沒收錄的新詞
  max_chars_en: 42         # 每行英文字元上限；× max_lines = 每張字卡的容量
  max_chars_zh: 18         # 每行中文字數上限，調大就少換行
  max_lines: 2
  min_duration: 1.0
  max_duration: 6.0        # 一張字卡最長停留幾秒，調大則字卡更少更長
  gap_break: 0.55
  translate_batch: 25

# ── 功能三：航線圖與名詞說明動畫 ────────────────────────────
explainers:
  enabled: true
  max_count: 12
  duration: 6.0
  min_gap: 15.0            # 兩段說明之間至少間隔幾秒
  fade: 0.5
  width: 1920
  height: 1080
  fps: 30
  route_style: "dark"      # dark | light
  font_path: ""            # 留空會自動找 macOS 內建中文字型

# 字詞修正：訂正語音辨識聽錯的人名、船名、專有名詞。
# 會套用到英文字幕與中文翻譯；英數詞比對不分大小寫且認單字邊界。
corrections: {}
# corrections:
#   Issa: "Isa"
#   荷巴特: "霍巴特"

media_timecodes: {}        # {檔名: "HH:MM:SS;FF"}

claude:
  backend: "cli"           # cli（吃訂閱額度） | api | auto
  model: ""                # 留空用預設
  use_cache: true          # 重跑階段時不重複燒額度
